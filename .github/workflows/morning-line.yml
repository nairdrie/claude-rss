name: Morning Line dashboard

# Builds Nick's "Morning Line" dashboard each morning and pins it to the top of
# the feed. Runs on GitHub's runners because the data lookups (Yahoo Finance
# quotes, the Sleeper fantasy API, MLB StatsAPI) need open internet, which the
# Claude routine's sandbox does not have — same reason backfill-thumbnails.yml
# exists.
#
# Reuses the SAME repo secrets as backfill-thumbnails.yml (no new setup):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  - get/put on feed/* (docs/s3-access.md)
#   AWS_REGION                                 - us-east-1 (optional)

on:
  schedule:
    # 10:00 UTC ≈ 6:00 AM America/Toronto during EDT (7:00 AM during EST).
    # Adjust if you'd rather it land after the US market opens for live day-change.
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button / API dispatch

concurrency:
  group: morning-line       # never overlap two runs writing the feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      # ubuntu-latest ships google-chrome-stable; used to render the cover PNG.
      CHROME_BIN: google-chrome-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Portfolio (quotes + history)
        run: python scripts/fetch_portfolio.py

      - name: Fantasy (Sleeper)
        run: python scripts/fetch_fantasy.py

      - name: Assemble dashboard + render cover
        run: python scripts/build_dashboard.py

      - name: Publish + pin to the feed
        run: python scripts/publish_dashboard.py
