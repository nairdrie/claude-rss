# ---------------------------------------------------------------------------
# Portfolio holdings for the Morning Line dashboard.
#
# This is the single source of truth for "what Nick owns". The daily job
# (scripts/fetch_portfolio.py) reads it, looks up a live quote for each symbol,
# normalizes everything to base_currency, and writes a summary + appends a
# daily snapshot to the history store. EDIT THIS when you buy/sell.
#
# `symbol`   : the Yahoo Finance symbol. Canadian listings need a suffix:
#              TSX -> ".TO", Cboe Canada (old NEO exchange) -> ".NE".
#              US listings have no suffix.
# `shares`   : share count (fractional ok).
# `currency` : the currency the position trades in (drives FX conversion).
# `ref_price`: value/shares from the 2026-08-28 Wealthsimple screenshots.
#              Used ONLY as a sanity check — if the live quote is wildly off,
#              the symbol is probably wrong and the job logs a warning.
# `unverified`: set when the ticker->symbol mapping is a guess (see NOTES).
# ---------------------------------------------------------------------------
base_currency: CAD

holdings:
  - { symbol: BA,      shares: 4,        currency: USD, name: "Boeing",                 ref_price: 209.61 }
  - { symbol: CM.TO,   shares: 15.2914,  currency: CAD, name: "CIBC",                   ref_price: 159.09 }
  - { symbol: DIS,     shares: 4.062,    currency: USD, name: "Disney",                 ref_price: 108.09 }
  - { symbol: ENB.TO,  shares: 18.4742,  currency: CAD, name: "Enbridge",               ref_price: 69.76 }
