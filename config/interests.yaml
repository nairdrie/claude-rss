feed:
  title: "Nick's Curated Feed"
  description: "AI-curated personal feed across tech, dev, and hobbies"
  link: "https://nairdrie-rss-feed.s3.us-east-1.amazonaws.com/feed/merged.xml"
  window_size: 50          # max items in the live feed
  daily_target: 50         # items to assemble in the morning full build
  max_incremental_adds: 5  # cap per non-daily run
  max_item_age_hours: 24   # hard cutoff: build_feed.py drops any candidate
                           # older than this regardless of mode, as a backstop
                           # on top of the research-time freshness guidance

topics:
  - name: sports
    detail: Toronto Maple Leafs (NHL), Buffalo Bills (NFL), Toronto Blue Jays (MLB), fantasy football, sports betting markets
    weight: high
  - name: news
    details: high park/swansea, or toronto, or canada, or usa/international, breaking news, political, local info. if anything relevant
    weight: high
  - name: finance
    details: stocks, S&P, nasdaq, gold/silver, breaking news earnings, companies, picks to watch
    weight: high
  - name: dev-tools
    detail: software engineering, AI news & tools, Claude Code, Claude API, MCP, AI coding-agent releases — used to build production software
    weight: high
  - name: gaming
    details: chess (tournaments, news), pokemon GO (daily events, news, upcoming events), nintendo, PC gaming, valorant, league of legends
    weight: high
  - name: crypto
    detail: Bitcoin cycle/halving analysis, on-chain cycle indicators, alt coin markets, news on alt coins
    weight: high
  - name: science
    details: research, interesting topics, education, space, physics, math
    weight: high
  - name: tech
    details: tech products, good deals, tech announcements, smart phones, apple, PCs, android

pinned:
  # Injected by build_feed.py -- not sourced from research, not subject to the
  # freshness cutoff or seen.json dedup (same URL every day by design). The
  # DAILY build pins these to the top of the fresh window (in list order);
  # INCREMENTAL builds leave them in place so the day's additions bury them.
  # Each morning's daily rebuild puts them back on top.

  # The Morning Line dashboard. Its page + cover are (re)rendered each morning
  # by the morning-line.yml Action at these stable URLs; this pin keeps the item
  # in the feed across the routine's daily rebuilds. build_pinned gives it a
  # date-keyed guid, so readers treat each day as a new item.
  - title: "🌅 The Morning Line"
    url: "https://nairdrie-rss-feed.s3.us-east-1.amazonaws.com/feed/apps/latest/dashboard.html"
    source: "The Morning Line"
    reason: "Your morning dashboard — fantasy, Jays, portfolio, markets, and Pokémon GO."
    image: "https://nairdrie-rss-feed.s3.us-east-1.amazonaws.com/feed/apps/latest/cover.png"

  - title: "Daily Chess Puzzle"
    url: "https://www.chess.com/daily"
    source: "Chess.com"
    reason: "Today's daily puzzle."

exclude:
  - generic listicles / SEO content farms
  - press releases with no new information
  - articles behind a hard paywall
