<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Morning Line — cover</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  /* Baked thumbnail — bold single-theme landscape card (1200x760, ~1.6:1) sized
     to survive a feed reader's crop. Key content stays centered. */
  :root {
    --bg:#0A111C; --surface:#141E2E; --line:#26344A;
    --ink:#EEF2F8; --ink-2:#9FAEC2; --muted:#6E7C90;
    --accent:#E9A63E; --up:#37C67E; --down:#EE6A55;
    --f-deck:"Oswald","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
    --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1200px; height:760px; overflow:hidden; }
  body {
    background:
      radial-gradient(90% 120% at 0% -10%, rgba(233,166,62,.20), transparent 45%),
      radial-gradient(80% 120% at 100% 110%, rgba(20,40,70,.55), transparent 50%),
      var(--bg);
    color:var(--ink); font-family:var(--f-body);
    padding:56px 66px; display:flex; flex-direction:column;
  }

  /* Header: logo + wordmark + date */
  .top { display:flex; align-items:center; gap:20px; }
  .mark { flex:none; }
  .wordmark { font-family:var(--f-deck); font-weight:700; text-transform:uppercase;
    letter-spacing:.13em; font-size:42px; line-height:1; display:flex; align-items:baseline; gap:14px; }
  .wordmark .the { color:var(--accent); font-weight:500; font-size:26px; letter-spacing:.22em; }
  .date { margin-left:auto; text-align:right; font-family:var(--f-deck); text-transform:uppercase;
    letter-spacing:.09em; line-height:1.25; }
  .date .d1 { color:var(--ink-2); font-size:20px; }
  .date .d2 { color:var(--ink); font-size:26px; font-weight:600; }
  .rule { height:3px; margin:22px 0 0;
    background:linear-gradient(90deg, var(--accent), rgba(233,166,62,.15) 65%, transparent); border-radius:2px; }

  /* Hero metrics */
  .metrics { flex:1; display:flex; align-items:center; justify-content:space-around; gap:24px; }
  .metric { flex:1; text-align:center; position:relative; padding:0 12px; }
  .metric + .metric::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    height:96px; width:1px; background:var(--line); }
  .m-big { font-family:var(--f-deck); font-weight:700; font-size:92px; line-height:.95; letter-spacing:-.01em;
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  .m-big.accent { color:var(--accent); } .m-big.up { color:var(--up); }
  .m-big.down { color:var(--down); } .m-big.ink { color:var(--ink); }
  .m-big .unit { font-size:52px; }
  .m-label { margin-top:14px; font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.11em;
    font-size:19px; color:var(--ink-2); }
  .m-sub { margin-top:4px; font-size:15px; color:var(--muted); }

  /* Footer stats strip */
  .foot { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    font-family:var(--f-mono); font-size:19px; color:var(--ink-2); padding-top:8px; }
  .foot .dot { width:4px; height:4px; border-radius:50%; background:var(--muted); flex:none; }
  .foot b { color:var(--ink); font-weight:700; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <g stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round">
        <circle cx="26" cy="30" r="11" fill="var(--accent)" stroke="none"/>
        <line x1="26" y1="6" x2="26" y2="13"/>
        <line x1="8"  y1="14" x2="13" y2="19"/>
        <line x1="44" y1="14" x2="39" y2="19"/>
        <line x1="3"  y1="31" x2="10" y2="31"/>
        <line x1="49" y1="31" x2="42" y2="31"/>
      </g>
    </svg>
    <div class="wordmark"><span class="the">The</span> Morning Line</div>
    <div class="date"><div class="d1" id="d1"></div><div class="d2" id="d2"></div></div>
  </div>
  <div class="rule"></div>
  <div class="metrics" id="metrics"></div>
  <div class="foot" id="foot"></div>

<!-- The daily runner replaces __COVER_JSON__ with the cover block. Standalone,
     the template falls back to SAMPLE. -->
<script id="cover-data" type="application/json">__COVER_JSON__</script>
<script>
  const SAMPLE = {
    date_line:"Friday", date_main:"Aug 29",
    metrics:[
      {big:"75%", label:"Fantasy · Win odds", kind:"accent"},
      {big:"+1.0%", label:"Portfolio · Today", kind:"up"},
      {big:"8–1", label:"Blue Jays · Won", kind:"up"},
    ],
    footer:[{t:"S&P ",b:"+0.5%"},{t:"BTC ",b:"−1.2%"},{t:"Leafs ",b:"20d"},{t:"",b:"4 PoGO events"}],
  };
  function load(){ try{ const t=(document.getElementById("cover-data").textContent||"").trim();
    if(!t||t==="__COVER_"+"JSON__") return null; return JSON.parse(t);}catch(e){return null;} }
  const C = load() || SAMPLE;

  document.getElementById("d1").textContent = C.date_line || "";
  document.getElementById("d2").textContent = C.date_main || "";

  // Split a leading +/− or W/L off the big value so we can size the unit down a touch.
  const mEl = document.getElementById("metrics");
  (C.metrics||[]).slice(0,3).forEach(m=>{
    const d=document.createElement("div"); d.className="metric";
    const big=document.createElement("div"); big.className="m-big "+(m.kind||"ink"); big.textContent=m.big;
    const lab=document.createElement("div"); lab.className="m-label"; lab.textContent=m.label||"";
    d.appendChild(big); d.appendChild(lab); mEl.appendChild(d);
  });

  const fEl=document.getElementById("foot");
  (C.footer||[]).forEach((s,i)=>{
    if(i){ const dot=document.createElement("span"); dot.className="dot"; fEl.appendChild(dot); }
    const span=document.createElement("span");
    span.textContent=s.t||""; if(s.b){ const b=document.createElement("b"); b.textContent=s.b; span.appendChild(b); }
    fEl.appendChild(span);
  });
</script>
</body>
</html>
