<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Morning Line</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F4F6F9; --inset:#EFF2F6;
    --ink:#131821; --ink-2:#4C5666; --muted:#8A94A4; --line:#E1E6EC; --line-2:#D3DAE3;
    --brand:#14263F; --brand-ink:#14263F; --accent:#C9822B;
    --up:#1C8C55; --down:#C23A2A; --warn:#B0791C;
    --shadow:0 1px 2px rgba(19,24,33,.05), 0 4px 14px rgba(19,24,33,.06);
    --radius:16px;
    --f-deck:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#080D15; --surface:#111927; --surface-2:#172131; --inset:#0D1420;
    --ink:#E9EEF5; --ink-2:#A7B2C2; --muted:#6C7788; --line:#212F45; --line-2:#2C3B54;
    --brand:#0C1522; --brand-ink:#E9EEF5; --accent:#E5A23C;
    --up:#37C67E; --down:#EE6A55; --warn:#D9A63E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
  } }
  :root[data-theme="dark"] {
    --bg:#080D15; --surface:#111927; --surface-2:#172131; --inset:#0D1420;
    --ink:#E9EEF5; --ink-2:#A7B2C2; --muted:#6C7788; --line:#212F45; --line-2:#2C3B54;
    --brand:#0C1522; --brand-ink:#E9EEF5; --accent:#E5A23C;
    --up:#37C67E; --down:#EE6A55; --warn:#D9A63E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap { max-width:600px; margin:0 auto; padding:0 12px 28px; }
  .tnum { font-variant-numeric:tabular-nums; }

  /* Masthead */
  .masthead { background:var(--brand); border-bottom:2px solid var(--accent); }
  .masthead-in { max-width:600px; margin:0 auto; padding:12px 16px; display:flex;
    align-items:baseline; gap:10px; }
  .wordmark { font-family:var(--f-deck); font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; font-size:18px; color:#EAF0F8; display:flex; gap:7px; }
  .wordmark .the { color:var(--accent); font-weight:500; font-size:13px; letter-spacing:.18em; }
  .dateline { margin-left:auto; font-family:var(--f-deck); text-transform:uppercase;
    letter-spacing:.05em; font-size:11px; color:#AEBCD0; white-space:nowrap;
    min-width:0; overflow:hidden; text-overflow:ellipsis; flex:none; }

  .greet { padding:16px 16px 6px; max-width:600px; margin:0 auto; }
  .greet h1 { font-family:var(--f-deck); font-weight:600; font-size:clamp(22px,6.5vw,28px);
    margin:0; letter-spacing:.005em; }
  .greet h1 .accent { color:var(--accent); }
  .greet .sub { color:var(--muted); font-size:12.5px; margin-top:3px;
    font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.08em; }

  /* Collapsible card */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-top:11px; overflow:hidden; }
  .card[open] { border-color:var(--line-2); }
  .card-hd { display:flex; align-items:center; gap:10px; padding:15px 15px; cursor:pointer;
    list-style:none; -webkit-tap-highlight-color:transparent; user-select:none; min-height:56px; }
  .card-hd::-webkit-details-marker { display:none; }
  .card-hd:active { background:var(--surface-2); }
  .card-hd .eyebrow { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.1em;
    font-weight:600; font-size:13px; color:var(--ink); display:flex; align-items:center; gap:8px;
    flex:none; }
  .card-hd .eyebrow::before { content:""; width:8px; height:8px; background:var(--accent);
    border-radius:2px; transform:rotate(45deg); flex:none; }
  .glance { flex:1 1 auto; min-width:0; margin-left:auto; text-align:right; font-size:13.5px;
    color:var(--ink-2); display:flex; align-items:center; gap:6px 8px; flex-wrap:wrap;
    justify-content:flex-end; font-variant-numeric:tabular-nums; }
  .glance b { color:var(--ink); font-weight:600; }
  .chev { flex:none; width:9px; height:9px; border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .18s ease;
    margin-left:2px; }
  .card[open] .chev { transform:rotate(45deg); }
  .card-body { padding:2px 15px 16px; border-top:1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .chev { transition:none; } }

  .badge-alert { font-family:var(--f-mono); font-weight:700; font-size:11px; color:var(--warn);
    background:color-mix(in srgb, var(--warn) 15%, transparent); padding:2px 7px; border-radius:20px; }

  /* Fantasy */
  .fant-league { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.06em;
    font-size:11.5px; color:var(--muted); margin:12px 0 8px; }
  .matchup { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .team .tname { font-family:var(--f-deck); font-weight:600; font-size:15px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .team.opp { text-align:right; }
  .team .trec { font-size:11px; color:var(--muted); font-family:var(--f-mono); }
  .team .proj { font-family:var(--f-mono); font-weight:700; font-size:24px; margin-top:2px; }
  .vs { font-family:var(--f-deck); font-size:11px; color:var(--muted); letter-spacing:.1em; }
  .winbar-wrap { grid-column:1/-1; margin-top:4px; }
  .winbar { height:8px; border-radius:5px; overflow:hidden; display:flex; background:var(--inset);
    border:1px solid var(--line); }
  .winbar .you-seg { background:var(--accent); } .winbar .opp-seg { background:var(--line-2); }
  .winbar-labels { display:flex; justify-content:space-between; font-family:var(--f-mono);
    font-size:11px; color:var(--ink-2); margin-top:5px; }
  .winbar-labels .lead { color:var(--accent); font-weight:700; }

  .subhead { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.1em; font-size:11px;
    color:var(--muted); font-weight:600; margin:16px 0 6px; display:flex; align-items:center; gap:8px; }
  .subhead::after { content:""; flex:1; height:1px; background:var(--line); }

  .lineup-row { display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); }
  .lineup-row:last-child { border-bottom:0; }
  .pos { font-family:var(--f-deck); font-weight:600; font-size:12px; color:var(--ink-2);
    background:var(--inset); border:1px solid var(--line); border-radius:6px; text-align:center;
    padding:4px 0; }
  .pos.flex { color:var(--accent); }
  .pl-name { font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .pl-sub { font-size:11.5px; color:var(--muted); font-family:var(--f-mono); margin-top:1px; }
  .pl-proj { font-family:var(--f-mono); font-weight:600; font-size:15px; text-align:right; }

  .pill { font-family:var(--f-deck); font-size:10px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; padding:2px 6px 1px; border-radius:4px; border:1px solid transparent;
    white-space:nowrap; }
  .pill.q { color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); border-color:color-mix(in srgb,var(--warn) 34%,transparent); }
  .pill.d { color:var(--down); background:color-mix(in srgb,var(--down) 12%,transparent); border-color:color-mix(in srgb,var(--down) 32%,transparent); }
  .pill.o { color:#fff; background:var(--down); }
  .pill.news { color:var(--ink-2); background:var(--inset); border-color:var(--line-2); }
  .pill.hot { color:var(--up); background:color-mix(in srgb,var(--up) 13%,transparent); border-color:color-mix(in srgb,var(--up) 32%,transparent); }

  .alert { display:flex; gap:9px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .alert:last-child { border-bottom:0; }
  .a-name { font-weight:600; font-size:14px; }
  .a-txt { font-size:12.5px; color:var(--ink-2); }
  .a-src { font-size:10.5px; color:var(--muted); font-family:var(--f-mono); }

  .waiver { display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:8px 0;
    border-bottom:1px dashed var(--line); align-items:center; }
  .waiver:last-child { border-bottom:0; }
  .w-name { font-weight:600; font-size:14px; }
  .w-sub { font-size:11.5px; color:var(--muted); font-family:var(--f-mono); }
  .w-trend { font-family:var(--f-mono); font-size:13px; color:var(--up); font-weight:700; text-align:right; }

  /* Sports */
  .score-line { display:flex; align-items:baseline; gap:10px; margin:10px 0 3px; }
  .res { font-family:var(--f-deck); font-weight:700; font-size:15px; padding:1px 8px; border-radius:5px; color:#fff; }
  .res.w { background:var(--up); } .res.l { background:var(--down); } .res.otl { background:var(--warn); }
  .sc { font-family:var(--f-mono); font-weight:700; font-size:20px; }
  .vs2 { color:var(--muted); font-size:13px; }
  .recap { font-size:13px; color:var(--ink-2); margin:2px 0 0; }
  .recap .star { color:var(--accent); font-weight:600; }
  .nextgame { display:flex; align-items:center; gap:12px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin:12px 0; }
  .ng-when { font-family:var(--f-deck); font-weight:600; font-size:13px; text-transform:uppercase;
    letter-spacing:.04em; text-align:center; color:var(--accent); line-height:1.15; white-space:nowrap; }
  .ng-when small { display:block; color:var(--muted); font-size:10.5px; }
  .ng-body { font-size:12.5px; color:var(--ink-2); border-left:1px solid var(--line-2); padding-left:12px; }
  .ng-body b { color:var(--ink); }
  .standing { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-2);
    padding:10px 12px; border-radius:10px; background:var(--inset); border:1px solid var(--line); flex-wrap:wrap; }
  .standing .sbadge { font-family:var(--f-deck); font-weight:700; font-size:12px; color:var(--brand-ink);
    background:var(--accent); padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .standing .gb { font-family:var(--f-mono); font-weight:700; color:var(--ink); }
  .news-line { font-size:12.5px; color:var(--ink-2); margin-top:11px; padding-left:12px; position:relative; }
  .news-line::before { content:""; position:absolute; left:0; top:7px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .news-line .src { color:var(--muted); font-family:var(--f-mono); font-size:11px; }

  .offseason { text-align:center; padding:12px 4px 4px; }
  .offseason .big { font-family:var(--f-deck); font-weight:700; font-size:36px; }
  .offseason .lbl { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:var(--muted); }
  .offseason .cd { margin-top:8px; font-family:var(--f-mono); color:var(--accent); font-weight:700; font-size:12.5px; }

  /* Portfolio */
  .port-top { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:12px 0 6px; }
  .port-total { font-family:var(--f-mono); font-weight:700; font-size:30px; line-height:1; }
  .port-day { display:flex; flex-direction:column; gap:2px; }
  .port-spark { margin-left:auto; }
  .holdings { margin-top:10px; }
  .hold-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .hold-row:last-child { border-bottom:0; }
  .h-left { min-width:0; flex:1; }
  .h-name { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .h-name .tkr { font-family:var(--f-mono); font-weight:700; font-size:13px; }
  .h-name .co { color:var(--muted); font-size:11.5px; }
  .h-sub { font-family:var(--f-mono); font-size:11.5px; color:var(--muted); margin-top:1px; }
  .h-right { text-align:right; flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .h-val { font-family:var(--f-mono); font-weight:700; font-size:14px; }

  .chip { font-family:var(--f-mono); font-weight:700; font-size:12.5px; display:inline-flex;
    align-items:center; gap:3px; white-space:nowrap; }
  .chip.up { color:var(--up); } .chip.down { color:var(--down); }

  /* Markets + PoGO */
  .ticks { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .tick { border:1px solid var(--line); border-radius:10px; padding:10px 11px; background:var(--surface-2); }
  .t-name { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; color:var(--muted); }
  .t-val { font-family:var(--f-mono); font-weight:700; font-size:16px; margin:2px 0 4px; }
  .pogo-item { display:flex; flex-direction:column; gap:2px; padding:10px 0; border-bottom:1px solid var(--line); }
  .pogo-item:last-child { border-bottom:0; }
  .p-tag { font-family:var(--f-deck); text-transform:uppercase; letter-spacing:.06em; font-size:10.5px;
    font-weight:600; color:var(--accent); display:flex; align-items:center; gap:6px; }
  .p-main { font-weight:600; font-size:14px; }
  .p-sub { font-size:11.5px; color:var(--ink-2); }

  .foot { max-width:600px; margin:0 auto; padding:18px 16px 8px; color:var(--muted);
    font-size:11px; font-family:var(--f-mono); text-align:center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div class="wordmark"><span class="the">The</span> Morning Line</div>
    <div class="dateline" id="dateline"></div>
  </div>
</header>
<div class="greet">
  <h1 id="greeting"></h1>
  <div class="sub" id="greetSub"></div>
</div>
<main class="wrap" id="app"></main>
<footer class="foot" id="foot"></footer>

<!-- The daily runner replaces __DASHBOARD_JSON__ with the real dashboard.json.
     Left untouched, the template falls back to SAMPLE_DATA and previews standalone. -->
<script id="feed-data" type="application/json">__DASHBOARD_JSON__</script>
<script>
const SAMPLE_DATA = {
  date:"Sunday, September 7, 2025", generatedAt:"6:05 AM ET", greetingName:"Nick",
  greetingSub:"season opens today · markets mixed",
  fantasy:{ league:"Chopped Unc FC", format:"12-team · PPR", week:1, meta:"Week 1 preview",
    you:{name:"Chopped Uncle Ben",record:"0-0",proj:118.4,winPct:58},
    opp:{name:"jwxc",record:"0-0",proj:111.9,winPct:42},
    starters:[{pos:"QB",name:"Josh Allen",team:"BUF",opp:"",proj:24.8},
      {pos:"RB",name:"James Cook",team:"BUF",opp:"",proj:15.6,status:{k:"news",txt:"NEWS"}}],
    alerts:[{name:"Puka Nacua",tag:"q",tagTxt:"Q",txt:"Knee — limited.",src:"Sleeper"}],
    waiver:[{name:"Ray Davis",sub:"RB · BUF · trending add",trend:"+38k",note:"hot add"}] },
  jays:{ last:{res:"W",score:"6–4",opp:"vs BOS",recap:"",star:""},
    next:{when:"Today",time:"7:07 PM",opp:"vs NYY",detail:"Probables: <b>Gausman</b> vs. <b>Rodón</b>"},
    standing:{sbadge:"2nd Wild Card",gb:"+1.5",record:"84-70",note:"holding a wild-card spot"}, news:null },
  leafs:{ inSeason:false, offBig:"22", offLbl:"days to camp", countdown:"Camp opens Sep 18 · Opener Oct 7 vs MTL", news:null },
  portfolio:{ total:38401.47, dayChange:371.59, dayPct:1.0, week:[38000,38200,38401],
    note:"Updated 6:50 PM",
    holdings:[{tkr:"VFV.TO",co:"Vanguard S&P 500",shares:116.57,price:190.4,dayPct:0.5,value:22192}] },
  markets:[{name:"S&P 500",val:"6,412",pct:0.5},{name:"Bitcoin",val:"$114.8K",pct:-1.5}],
  pogo:[{icon:"⚔️",tag:"Raid Battles",main:"Mega Gyarados",sub:"ends Sep 8"}],
};

const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (n,d=0)=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const signPct = (p)=>(p>=0?"+":"−")+Math.abs(p).toFixed(Math.abs(p)<10&&p!==Math.round(p)?1:(p===Math.round(p)?0:1))+"%";
function pctChip(p){ const up=p>=0; return `<span class="chip ${up?"up":"down"} tnum">${up?"▲":"▼"} ${signPct(p)}</span>`; }
function spark(vals,w=118,h=30){ if(!vals||vals.length<2)vals=[0,0];
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,dx=w/(vals.length-1);
  const pts=vals.map((v,i)=>[+(i*dx).toFixed(1),+(h-2-((v-mn)/rg)*(h-4)).toFixed(1)]);
  const line=pts.map(p=>p.join(",")).join(" "),up=vals[vals.length-1]>=vals[0],col=up?"var(--up)":"var(--down)";
  const g="g"+Math.random().toString(36).slice(2,7),[ex,ey]=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${line} ${w},${h}" fill="url(#${g})"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="3" fill="${col}"/></svg>`; }
function pill(s){ return s?`<span class="pill ${esc(s.k)}">${esc(s.txt)}</span>`:""; }

function card(key, eyebrow, glance, body) {
  return `<details class="card" data-key="${esc(key)}">
    <summary class="card-hd"><span class="eyebrow">${esc(eyebrow)}</span>
      <span class="glance">${glance}</span><span class="chev"></span></summary>
    <div class="card-body">${body}</div></details>`;
}

function fantasyCard(f){
  const you=f.you||{}, opp=f.opp||{};
  const hasProj = you.proj!=null && opp.proj!=null;
  const glance = (hasProj?`<b class="tnum">${you.proj.toFixed(1)}</b>–<span class="tnum">${opp.proj.toFixed(1)}</span>`:`Wk ${esc(String(f.week||""))}`)
    + (you.winPct!=null?` · <b>${you.winPct}%</b>`:"")
    + ((f.alerts&&f.alerts.length)?` <span class="badge-alert">${f.alerts.length}⚠</span>`:"");
  const lineup=(f.starters||[]).map(p=>`<div class="lineup-row">
      <div class="pos ${p.pos==="FLEX"?"flex":""}">${esc(p.pos)}</div>
      <div><div class="pl-name">${esc(p.name)} ${pill(p.status)}</div>
        <div class="pl-sub">${esc(p.team)}${p.opp?" · "+esc(p.opp):""}</div>
        ${p.note?`<div class="pl-sub" style="color:var(--ink-2)">${esc(p.note)}</div>`:""}</div>
      <div class="pl-proj tnum">${p.proj!=null?p.proj.toFixed(1):"—"}</div></div>`).join("");
  const alerts=(f.alerts||[]).map(a=>`<div class="alert"><span class="pill ${esc(a.tag)}">${esc(a.tagTxt)}</span>
      <div><div class="a-name">${esc(a.name)}</div><div class="a-txt">${esc(a.txt)}</div>
      <div class="a-src">${esc(a.src)}</div></div></div>`).join("");
  const waiver=(f.waiver||[]).map(w=>`<div class="waiver">
      <div><div class="w-name">${esc(w.name)} <span class="pill hot">${esc(w.note||"hot")}</span></div>
      <div class="w-sub">${esc(w.sub)}</div></div><div class="w-trend tnum">${esc(w.trend)}</div></div>`).join("");
  const leagueLine=[f.league||"League",f.format,f.meta||(f.week?"Week "+f.week:"")].filter(Boolean).map(esc).join(" · ");
  const body=`<div class="fant-league">${leagueLine}</div>
    <div class="matchup">
      <div class="team you"><div class="tname">${esc(you.name||"—")}</div><div class="trec">${esc(you.record||"")}</div><div class="proj tnum">${you.proj!=null?you.proj.toFixed(1):"—"}</div></div>
      <div class="vs">VS</div>
      <div class="team opp"><div class="tname">${esc(opp.name||"—")}</div><div class="trec">${esc(opp.record||"")}</div><div class="proj tnum">${opp.proj!=null?opp.proj.toFixed(1):"—"}</div></div>
      ${(you.winPct!=null&&opp.winPct!=null)?`<div class="winbar-wrap"><div class="winbar"><div class="you-seg" style="width:${you.winPct}%"></div><div class="opp-seg" style="width:${opp.winPct}%"></div></div>
        <div class="winbar-labels"><span class="lead tnum">${you.winPct}% win</span><span class="tnum">${opp.winPct}%</span></div></div>`:""}
    </div>
    ${lineup?`<div class="subhead">Projected starters</div>${lineup}`:""}
    ${alerts?`<div class="subhead">Roster alerts</div>${alerts}`:""}
    ${waiver?`<div class="subhead">Waiver watch — trending</div>${waiver}`:""}`;
  return card("fantasy","Fantasy",glance,body);
}

function jaysCard(j){
  const last=j.last, nxt=j.next, st=j.standing||{};
  const glance=(last?`<span class="chip ${last.res==="W"?"up":"down"}">${esc(last.res)} ${esc(last.score)}</span>`:"")
    +(nxt?` · ${esc(nxt.time||nxt.when||"")}`:"");
  const body=`${last?`<div class="score-line"><span class="res ${last.res==="W"?"w":(last.res==="L"?"l":"otl")}">${esc(last.res)}</span>
      <span class="sc tnum">${esc(last.score)}</span><span class="vs2">${esc(last.opp)}</span></div>
      ${(last.recap||last.star)?`<p class="recap">${esc(last.recap||"")}${last.star?` <span class="star">★ ${esc(last.star)}</span>`:""}</p>`:""}`:""}
    ${nxt?`<div class="nextgame"><div class="ng-when">${esc(nxt.when)}<small>${esc(nxt.time)}</small></div>
      <div class="ng-body">${esc(nxt.opp)}${nxt.detail?" · "+nxt.detail:""}</div></div>`:""}
    ${st.sbadge?`<div class="standing"><span class="sbadge">${esc(st.sbadge)}</span>
      ${st.gb?`<span class="gb tnum">${esc(st.gb)}</span>`:""}<span>${esc(st.note||"")}</span></div>`:""}
    ${j.news?`<p class="news-line">${esc(j.news.txt)}${j.news.src?` <span class="src">— ${esc(j.news.src)}</span>`:""}</p>`:""}`;
  return card("jays",`Blue Jays${st.record?" · "+esc(st.record):""}`,glance,body);
}

function leafsCard(l){
  if(l.inSeason) return card("leafs","Maple Leafs","in season","<p class='recap'>In-season view.</p>");
  const glance=`<b>${esc(l.offBig)}</b> ${esc(l.offLbl)}`;
  const body=`<div class="offseason"><div class="big tnum">${esc(l.offBig)}</div><div class="lbl">${esc(l.offLbl)}</div>
      <div class="cd">${esc(l.countdown)}</div></div>
    ${l.news?`<p class="news-line">${esc(l.news.txt)}${l.news.src?` <span class="src">— ${esc(l.news.src)}</span>`:""}</p>`:""}`;
  return card("leafs","Maple Leafs",glance,body);
}

function portfolioCard(p){
  const glance=`<b class="tnum">${money(p.total)}</b> ${pctChip(p.dayPct)}`;
  const rows=(p.holdings||[]).map(h=>`<div class="hold-row">
      <div class="h-left"><div class="h-name"><span class="tkr">${esc(h.tkr)}</span> <span class="co">${esc(h.co||"")}</span></div>
        <div class="h-sub">${h.shares} sh · ${money(h.price,h.price<1000?2:0)}</div></div>
      <div class="h-right"><div class="h-val tnum">${money(h.value)}</div>${pctChip(h.dayPct)}</div></div>`).join("");
  const body=`<div class="port-top"><div class="port-total tnum">${money(p.total,2)}</div>
      <div class="port-day"><span class="chip ${p.dayChange>=0?"up":"down"} tnum">${p.dayChange>=0?"▲":"▼"} ${money(Math.abs(p.dayChange),2)}</span>
      <span class="chip ${p.dayPct>=0?"up":"down"} tnum">${signPct(p.dayPct)} today</span></div>
      <div class="port-spark">${spark(p.week)}</div></div>
    ${rows?`<div class="holdings">${rows}</div>`:""}
    <div class="a-src" style="margin-top:10px">${esc(p.note||"")}</div>`;
  return card("portfolio","Portfolio",glance,body);
}

function marketsCard(m){
  const by={}; m.forEach(t=>by[t.name]=t);
  const key=["S&P 500","Bitcoin"].filter(n=>by[n]).map(n=>`${esc(n==="S&P 500"?"S&P":n)} ${by[n].pct>=0?"+":""}${by[n].pct.toFixed(1)}%`);
  const ticks=m.map(t=>`<div class="tick"><div class="t-name">${esc(t.name)}</div>
      <div class="t-val tnum">${esc(t.val)}</div>${pctChip(t.pct)}</div>`).join("");
  return card("markets","Markets",key.join(" · "),`<div class="ticks">${ticks}</div>`);
}

function pogoCard(items){
  const body=items.map(p=>`<div class="pogo-item"><div class="p-tag">${p.icon||"📅"} ${esc(p.tag)}</div>
      <div class="p-main">${esc(p.main)}</div>${p.sub?`<div class="p-sub">${esc(p.sub)}</div>`:""}</div>`).join("");
  return card("pogo","Pokémon GO",`${items.length} event${items.length!==1?"s":""}`,body);
}

function render(d){
  // Short date in the masthead so it never overflows on a phone (e.g. "SUN · SEP 7").
  const dp=d.date.split(/,?\s+/); // ["Sunday","September","7","2025"]
  const shortDate=dp.length>=3 ? `${dp[0].slice(0,3)} · ${dp[1].slice(0,3)} ${dp[2]}` : d.date;
  document.getElementById("dateline").textContent=shortDate.toUpperCase();
  document.getElementById("greeting").innerHTML=`Good morning, <span class="accent">${esc(d.greetingName)}</span>.`;
  document.getElementById("greetSub").textContent=d.greetingSub||"";
  document.getElementById("app").innerHTML=[
    d.fantasy?fantasyCard(d.fantasy):"",
    d.portfolio?portfolioCard(d.portfolio):"",
    d.jays?jaysCard(d.jays):"",
    d.leafs?leafsCard(d.leafs):"",
    (d.markets&&d.markets.length)?marketsCard(d.markets):"",
    (d.pogo&&d.pogo.length)?pogoCard(d.pogo):"",
  ].join("");
  document.getElementById("foot").textContent=`The Morning Line · generated ${d.generatedAt} · tap a section to expand`;
  restoreOpenState();
}

// Remember which sections the reader keeps open (per-viewer convenience).
const LS="ml-open";
function restoreOpenState(){
  let open={}; try{ open=JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){}
  document.querySelectorAll("details[data-key]").forEach(el=>{
    if(open[el.dataset.key]) el.open=true;
    el.addEventListener("toggle",()=>{
      try{ const o=JSON.parse(localStorage.getItem(LS)||"{}")||{}; o[el.dataset.key]=el.open;
        localStorage.setItem(LS,JSON.stringify(o)); }catch(e){}
    });
  });
}

function loadInjectedData(){
  try{ const el=document.getElementById("feed-data"); const t=(el.textContent||"").trim();
    if(!t||t==="__DASHBOARD_"+"JSON__") return null; return JSON.parse(t);
  }catch(e){ console.warn("feed-data parse failed",e); return null; }
}
render(loadInjectedData()||SAMPLE_DATA);
</script>
</body>
</html>
